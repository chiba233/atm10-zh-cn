name: Release

# 构建分发包并发布 GitHub Release：assemble.py 组装出货树，运行生成器，
# gen_upstream_patches.py 对各版本官方文件打补丁，build_dist.sh 打包。
#
# 触发方式：
#   1. push tag v*：按 tag 名解析版本号，自动发布 release。
#   2. workflow_dispatch：在 Actions 页面手动触发，可选是否发布。
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after building
        type: boolean
        required: true
        default: false
      version:
        description: 补丁版本号，如 r12（与整合包版本无关；产物名里的 atm7.x 才是整合包版本）
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build distribution zip
    runs-on: ubuntu-latest
    # 与 build.yml 用同一套固定的工具链，发布产物要能与 CI 产物逐字节比对。
    container:
      image: python@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    # 容器里 GitHub Actions 默认用 sh，而脚本里到处是 set -o pipefail（bash 才有）
    defaults:
      run:
        shell: bash
    env:
      ATM_TOOLCHAIN_DIGEST: sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
      # 这条流水线带 jar 完整生成，以生成物为前提的检查缺前提时一律失败。
      GATE_STRICT: '1'
    steps:
      - uses: actions/checkout@v7

      # 校验在 build_dist.sh 里：check.py 查的是构建时才有的出货树，且每个整合包版本各查一遍。

      # 三条路径：
      #   tag push (vr13 / v7.2-release11) ──> publish=true
      #   manual + publish=true + version ──> publish=true
      #   manual + publish=false ──> 只构建不发布
      - name: Resolve release options
        id: release
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 必须同时确认 event 是 tag push。只看 GITHUB_REF_TYPE 的话，
          #    `gh workflow run release.yml --ref vr16-beta3 -f publish_release=false`
          #    也满足「ref 是 tag」，会忽略 publish_release=false 照常发布，
          #    还会覆盖已有 Release 的资产（issue #9 P1-3）。
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            # 补丁版本号与整合包版本无关（产物名是 -<补丁版本>-atm<整合包版本>.zip），认两种 tag：
            #   新：vR12 / vr12 / v12 / v12.1 / vR12-beta2
            #   旧：v7.2-release11 / v7.2-beta6
            # r 大小写都认：CHANGELOG 的段名写作 `## R12`。
            if [[ ! "$tag" =~ ^[vV][rR]?[0-9]+(\.[0-9]+)*(-(release|beta|rc)[0-9]+)?$ ]]; then
              echo "❌ Tag '$tag' 不是认得的形态。写 vR12 / vR12-beta1，旧式 v7.2-release11 也行。" >&2
              exit 1
            fi
            version="${tag#v}"
            beta=false
            [[ "$version" =~ -(beta|rc)[0-9]+$ ]] && beta=true
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "beta=$beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publish_release="$PUBLISH_RELEASE"
          version="$RELEASE_INPUT_VERSION"

          if [[ "$publish_release" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=${version:-0.0.0-ci}" >> "$GITHUB_OUTPUT"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$version" ]]; then
            echo "A version is required when publishing a release." >&2
            exit 1
          fi
          # 与上面 tag 的格式相同（少一个前导 v）：
          # 新 R12 / r12 / 12 / 12.1 / R12-beta2。旧 7.2-release11 / 7.2-beta6
          if [[ ! "$version" =~ ^[rR]?[0-9]+(\.[0-9]+)*(-(release|beta|rc)[0-9]+)?$ ]]; then
            echo "❌ 版本号 '$version' 不是认得的形态。写 R12 / R12-beta1，旧式 7.2-release11 也行。" >&2
            exit 1
          fi
          beta=false
          [[ "$version" =~ -(beta|rc)[0-9]+$ ]] && beta=true
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      # 不用 actions/setup-python：这个 job 运行在固定的容器里（bookworm，glibc 2.36），
      # runner 下载的 Python 需要 GLIBC 2.38，会报「libm.so.6: version GLIBC_2.38 not found」。
      # 容器自带的 python 就是固定版本。
      - name: 安装依赖
        run: |
          python -m pip install --quiet --require-hashes -r requirements.lock
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            curl unzip zip git ca-certificates default-jdk-headless >/dev/null
          # javac：同 build.yml，供 patch_vaultpatcher.py 编译 VaultPatcher 的性能补丁。

      - name: 核对工具链
        run: python3 scripts/toolchain.py --strict

      - name: 下载字体
        run: ./scripts/fetch_fonts.sh


      # 已发布版本的 overrides 不会变，缓存键用仓库里记录的指纹，只有改了目标版本才失效。
      # 命中缓存就不访问 CurseForge。未命中才下载，下载后必须与 versions/<版本>/overrides.sha256
      # 一致，否则构建失败。
      - uses: actions/cache@v6
        with:
          path: build/packsrc
          key: packsrc-${{ hashFiles('versions/*/overrides.sha256') }}

      - name: 下载整合包与全部模组 jar
        run: |
          set -euo pipefail
          # 生成器要读 mod jar 里的 en_us 与注册表，取最新版即可（资源包 lang 各版本通用）。
          NEWEST=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1)
          python3 scripts/fetch_pack.py "$NEWEST" pack
          echo "ATM_PACK_ROOT=$PWD/pack" >> "$GITHUB_ENV"
          # 每个目标版本再下载一份 overrides（不下 jar）：上游补丁必须对着该版的官方文件打。
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            [ -d "build/packsrc/$v/kubejs" ] || python3 scripts/fetch_pack.py "$v" "build/packsrc/$v" --no-jars
          done
          # 下载的 jar 必须与 versions/db/<版本>/jars.json 逐字节一致，否则限速、404、下错文件
          # 只会让生成器少产内容而不报错（issue #9 P1-5）。
          python3 scripts/build_version_db.py --verify "$NEWEST" pack/mods

      - name: 生成全部汉化产物
        run: ./scripts/generate_all.sh

      # 下面两项检查要读 mod jar，与 build.yml 相同，发版时同样运行：市政厅界面 XML、
      # 建筑棒蓝图路径用作 Map 键（issue #3）。（issue #9 P1-4）
      - name: 检查界面 XML 映射
        run: python3 scripts/compliance/check_gui_maps.py "$ATM_PACK_ROOT/mods"

      - name: 检查蓝图类别路径
        run: python3 scripts/compliance/check_minecolonies_paths.py "$ATM_PACK_ROOT/mods"

      - name: 打包全部整合包版本
        # 不给第二个参数，就打包 versions/whitelist.txt 里的全部版本。
        run: ./scripts/build_dist.sh "${{ steps.release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.zip
          if-no-files-found: error

      # 只准备材料：核对包是否齐全、取出 CHANGELOG 段落。容器里没有 gh CLI，发布交给
      # 下面的 action。不发布时也运行，包不齐或 CHANGELOG 缺段落在推 tag 之前就能发现。
      - name: 备好发版材料
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # 取 CHANGELOG 里对应的段落。标题按整串比对，不用正则：段名里出现过 `.` 和 `*`
          # （`## 7.*`），当正则会匹配上 `## 7.2`。大小写不敏感：tag 写 `vr12`，段名是 `## R12`。
          extract() {
            awk -v ver="## $1" '
              tolower($0) == tolower(ver) { found=1; next }
              found && /^## / { exit }
              found { buf = buf $0 "\n" }
              END { sub(/^\n+/, "", buf); sub(/\n+$/, "", buf); print buf }
            ' CHANGELOG.md
          }
          # 顺序：精确补丁版本，然后是文件里第一个 ## 段（当前在写的那一段）。不回落到去掉通道
          # 后缀的基版本：`## 7.2` 是冻结的历史段（431 行），推 v7.2-release12 会把整段当新版说明。
          FROM="## $RELEASE_VERSION"
          NOTES=$(extract "$RELEASE_VERSION")
          if [ -z "$NOTES" ]; then
            FIRST=$(awk '/^## /{sub(/^## /,""); print; exit}' CHANGELOG.md)
            FROM="## $FIRST（回落）"
            NOTES=$(extract "$FIRST")
          fi
          if [ -z "$NOTES" ]; then
            echo "❌ CHANGELOG.md 里一个 ## 段都取不到，发版说明会是空的，先写 CHANGELOG" >&2
            exit 1
          fi
          echo "发版说明取自 CHANGELOG 的 $FROM"

          # 发版说明最前面固定两条提示：不要把 server 包当客户端下载，装完要把资源包挪到「已选」
          # 最顶部，否则大部分汉化不生效。这两件事都发生在下载时，服务端包里也没有
          # kubejs/client_scripts，游戏内提示管不到。例子里的整合包版本按白名单取，出新版不用改。
          EX_MC=$(python3 scripts/release_versions.py | tr ' ' '\n' | tail -1)
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            printf '%s\n' \
              '> ## 下载前先看这两条' \
              '>' \
              '> 1. 带 `client` 的包给玩家装，带 `server` 的包只有开服才需要。' \
              ">    例如 \`atm10-zh_cn-client-${RELEASE_VERSION}-atm${EX_MC}.zip\` 是客户端的包。" \
              ">    末尾的 \`atm${EX_MC}\` 是整合包版本，按你的整合包版本挑。" \
              '> 2. 装完进游戏，打开「选项」里的「资源包」。' \
              '>    汉化包必须在「已选」一侧的最顶部，否则大部分汉化不生效。' \
              ''
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

          # 一次发版包含全部整合包版本的包：
          #   atm10-zh_cn-{client,server}-<补丁版本>-atm<整合包版本>.zip
          # build_dist.sh 产出 ASCII 文件名（解压后的文件夹名也是），中文文件夹名在 Windows
          # 的不同解压软件里编码不一致，会变成乱码。白名单里每个版本都必须有客户端与服务端
          # 两个包，按清单逐个检查，缺一个就不发布。
          # 不用 mapfile：它是 bash 4+ 的内建，macOS 自带的 bash 3.2 没有。
          ZIPS=()
          for v in $(python3 scripts/release_versions.py); do
            for side in client server; do
              f="dist/atm10-zh_cn-${side}-${RELEASE_VERSION}-atm${v}.zip"
              [ -f "$f" ] || { echo "❌ 缺少 $f"; exit 1; }
              ZIPS+=("$f")
            done
          done
          [ "${#ZIPS[@]}" -ge 2 ] || { echo "❌ versions/whitelist.txt 里一个版本都没有"; exit 1; }
          printf '  挂载: %s\n' "${ZIPS[@]}"

          {
            echo 'files<<RELEASE_FILES_EOF'
            printf '%s\n' "${ZIPS[@]}"
            echo 'RELEASE_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        # 固定完整 commit SHA：这一步有 contents:write，用可移动的 @v3 的话，标签被挪动或上游
        # 被入侵时写权限就转移了（issue #9 P1-6）。对应 softprops/action-gh-release v3.0.2，
        # 与 v2.6.2 的 action.yml 只差 `using: node20` → `node24`，输入项相同。
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: 绿油油版汉化 v${{ steps.release.outputs.version }}
          body: ${{ steps.publish.outputs.notes }}
          prerelease: ${{ steps.release.outputs.beta }}
          files: ${{ steps.publish.outputs.files }}
          fail_on_unmatched_files: true

      # 在 run 摘要页列出发布的包、大小、sha256，以及发版说明取自 CHANGELOG 的哪一段。
      # 发版不可撤回，说明取错段落要能一眼看到（`## 7.*` 当正则时会匹配上 `## 7.2`）。
      #
      # 整块容错：算不出数不影响已经发布的版本。
      - name: 作业摘要
        if: always()
        # 一律走 env，不把 ${{ }} 内联进 run：发版说明来自 CHANGELOG，内联会被 shell 解析
        # （反引号、$(...) 都会执行），走环境变量始终是数据。所以也不用 heredoc：终止符缩进
        # 错了不闭合，正文里出现一行 EOF 标记会截断。
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          BETA: ${{ steps.release.outputs.beta }}
          NOTES: ${{ steps.publish.outputs.notes }}
        run: |
          {
            printf '## 发版 v%s\n\n' "$VERSION"
            echo '| | |'
            echo '|---|---|'
            if [ "$PUBLISH" = 'true' ]; then
              echo '| 是否真的发布 | 是 |'
            else
              echo '| 是否真的发布 | 否（只构建，没推 release）|'
            fi
            printf '| 预发布 | %s |\n' "$BETA"
            printf '| 整合包版本 | %s |\n' \
              "$(python3 scripts/release_versions.py)"
            printf '\n### 挂载的包\n\n| 文件 | 大小 | sha256 |\n|---|--:|---|\n'
            for f in dist/*.zip; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s | `%s…` |\n' "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -c1-16)"
            done
            printf '\n### 发版说明（就是挂上去的那份）\n\n'
            echo '<details><summary>展开</summary>'
            echo
            printf '%s\n' "$NOTES"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY" || true
