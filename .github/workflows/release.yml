# atm10-zh-cn — All the Mods 10 简体中文汉化补丁「绿油油版」
# Copyright (C) 2026 星野夢華 (Hoshino Yumeka)
# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# 构建分发包并发布 GitHub Release。
# 仓库里没有任何一棵出货目录树：assemble.py 从 src/ 现摊、生成器现产、
# gen_upstream_patches.py 对着**各版本官方文件**现打补丁，再由 build_dist.sh 压包。
#
# 触发方式：
#   1. push tag v* —— 自动按 tag 名解析版本号、自动发布 release；
#   2. workflow_dispatch —— Actions 页面手动触发，可选发布。
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after building
        type: boolean
        required: true
        default: false
      version:
        description: 补丁版本号，如 r12（与整合包版本无关；产物名里的 atm7.x 才是整合包版本）
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build distribution zip
    runs-on: ubuntu-latest
    # 与 build.yml 同一套钉死的工具链——发布产物必须能和 CI 产物逐字节对上。
    container:
      image: python@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    # 容器里 GitHub Actions 默认用 sh，而脚本里到处是 set -o pipefail（bash 才有）
    defaults:
      run:
        shell: bash
    env:
      ATM_TOOLCHAIN_DIGEST: sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
      # 这条流水线是带 jar 跑完整生成的，所以「前提是生成物却没生成」一律算失败，
      # 不许打一行 ℹ️ 就放过去——发版比日常构建更不该有 fail-open。
      GATE_STRICT: '1'
    steps:
      - uses: actions/checkout@v7

      # 校验挪进 build_dist.sh 了：check.py 查的是**出货树**，而出货树是构建时才有的，
      # 而且每个整合包版本各查一遍（上游文件按版本不同）。

      # 三条路径：
      #   tag push (vr13 / v7.2-release11) ──> publish=true
      #   manual + publish=true + version ──> publish=true
      #   manual + publish=false ──> 只构建不发布
      - name: Resolve release options
        id: release
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # ⚠️ 必须同时确认 event 就是 tag push。只看 GITHUB_REF_TYPE 的话，
          #    `gh workflow run release.yml --ref vr16-beta3 -f publish_release=false`
          #    也满足「ref 是 tag」，于是 publish_release=false 被无视、照发不误，
          #    还会覆盖已有 Release 的资产。（issue #9 P1-3）
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            # 补丁版本号已与整合包版本解耦（产物名是 -<补丁版本>-atm<整合包版本>.zip），
            # 所以 tag 认两种：
            #   新：vR12 / vr12 / v12 / v12.1 / vR12-beta2
            #   旧：v7.2-release11 / v7.2-beta6（历史 tag，继续认，别把老流程弄挂）
            # r 大小写都认：CHANGELOG 的段名写作 `## R12`，人自然会跟着写大写。
            if [[ ! "$tag" =~ ^[vV][rR]?[0-9]+(\.[0-9]+)*(-(release|beta|rc)[0-9]+)?$ ]]; then
              echo "❌ Tag '$tag' 不是认得的形态。写 vR12 / vR12-beta1，旧式 v7.2-release11 也行。" >&2
              exit 1
            fi
            version="${tag#v}"
            beta=false
            [[ "$version" =~ -(beta|rc)[0-9]+$ ]] && beta=true
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "beta=$beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publish_release="$PUBLISH_RELEASE"
          version="$RELEASE_INPUT_VERSION"

          if [[ "$publish_release" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=${version:-0.0.0-ci}" >> "$GITHUB_OUTPUT"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$version" ]]; then
            echo "A version is required when publishing a release." >&2
            exit 1
          fi
          # 与上面 tag 那条**同一个形态**（少个前导 v），别两边各写一套然后对不上：
          # 新 R12 / r12 / 12 / 12.1 / R12-beta2；旧 7.2-release11 / 7.2-beta6
          if [[ ! "$version" =~ ^[rR]?[0-9]+(\.[0-9]+)*(-(release|beta|rc)[0-9]+)?$ ]]; then
            echo "❌ 版本号 '$version' 不是认得的形态。写 R12 / R12-beta1，旧式 7.2-release11 也行。" >&2
            exit 1
          fi
          beta=false
          [[ "$version" =~ -(beta|rc)[0-9]+$ ]] && beta=true
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      # **不要用 actions/setup-python**：这个 job 跑在锁定容器里（bookworm，glibc 2.36），
      # 而 runner 下下来的那份 Python 要 GLIBC 2.38，一跑就
      # 「libm.so.6: version GLIBC_2.38 not found」。容器自带的 python 就是钉好的那个。
      - name: 装依赖（哈希锁定）
        run: |
          python -m pip install --quiet --require-hashes -r requirements.lock
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            curl unzip zip git ca-certificates default-jdk-headless >/dev/null
          # javac：同 build.yml，给 patch_vaultpatcher.py 编 VaultPatcher 的性能补丁。

      - name: 核对工具链
        run: python3 scripts/toolchain.py --strict

      - name: 取字体（全部 OFL）
        run: ./scripts/fetch_fonts.sh


      # ATM10 的某个已发布版本，overrides 内容是不会变的，所以缓存键就用仓库里记的
      # 那三个指纹——只有我们**有意**改了目标版本时才会失效。
      # 这一步是为了把 CurseForge（全链唯一不可控的外部依赖）从最高频的那道闸上挪开：
      # 命中缓存就完全不联网；未命中才下，且下完必须与 versions/<版本>/overrides.sha256
      # 对得上，否则构建当场红。
      - uses: actions/cache@v6
        with:
          path: build/packsrc
          key: packsrc-${{ hashFiles('versions/*/overrides.sha256') }}

      - name: 下整合包（overrides + 全部 mod jar）
        run: |
          set -euo pipefail
          # 生成器要读 mod jar 里的 en_us 与注册表，取最新那版一次即可
          # （资源包 lang 按命名空间索引，跨版本通用）。
          NEWEST=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1)
          python3 scripts/fetch_pack.py "$NEWEST" pack
          echo "ATM_PACK_ROOT=$PWD/pack" >> "$GITHUB_ENV"
          # 每个目标版本再取一份 overrides（只要官方文件，不下 jar）——
          # 打上游补丁必须对着**该版**的官方文件，否则等于把旧上游发给新版本用户。
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            [ -d "build/packsrc/$v/kubejs" ] || python3 scripts/fetch_pack.py "$v" "build/packsrc/$v" --no-jars
          done
          # 下来的字节必须与 versions/db/<版本>/jars.json 逐字节一致。
          # 以前只写进临时的 mods.provenance.json，没人跟仓库里的基线比对过——
          # 限速/404/拿错文件都只会让生成器少产内容，不会有人发现。（issue #9 P1-5）
          python3 scripts/build_version_db.py --verify "$NEWEST" pack/mods

      - name: 生成全部汉化产物
        run: ./scripts/generate_all.sh

      # 下面两道闸要读 mod jar，Build 里有、Release 里以前没有——等于「打 tag 就能
      # 绕过已知的崩溃闸」。两条都是拿实机崩溃换来的：市政厅 XML（2026-07-28）、
      # 建筑棒蓝图路径当 Map 键（issue #3）。（issue #9 P1-4）
      - name: 界面 XML 映射三条硬规矩
        run: python3 scripts/compliance/check_gui_maps.py "$ATM_PACK_ROOT/mods"

      - name: 蓝图类别路径不许被替换表改动
        run: python3 scripts/compliance/check_minecolonies_paths.py "$ATM_PACK_ROOT/mods"

      - name: 打包全部整合包版本
        # 不给第二个参数 = 出 versions/ 下声明过的全部版本。
        # 通配只在仓库声明过的版本里展开，ATM 发新版不会自动混进来。
        run: ./scripts/build_dist.sh "${{ steps.release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.zip
          if-no-files-found: error

      # 只准备材料：核对包齐不齐、取出 CHANGELOG 段落。
      # **不在这里调 gh**——这个 job 跑在锁定容器里（产物字节要可复现），
      # 容器里没有 gh CLI。真正的发布交给下面那个 action。
      # **每次都跑**，不看发不发布：包齐不齐、CHANGELOG 有没有对应段落，
      # 应该在不发版的那次构建里就暴露，而不是等推了 tag 才炸。
      - name: 备好发版材料
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # 取 CHANGELOG 里对应的段落。标题**按整串精确比对**，不走正则——
          # 历史上段名带过 `.` 和 `*`（`## 7.*`），当正则用会顺手匹配上 `## 7.2`，
          # 发出去的说明就是别的版本的。
          # 大小写不敏感：tag 写 `vr12`，CHANGELOG 里的段名是 `## R12`。
          extract() {
            awk -v ver="## $1" '
              tolower($0) == tolower(ver) { found=1; next }
              found && /^## / { exit }
              found { buf = buf $0 "\n" }
              END { sub(/^\n+/, "", buf); sub(/\n+$/, "", buf); print buf }
            ' CHANGELOG.md
          }
          # 顺序：精确补丁版本 → 文件里第一个 ## 段（当前在写的那一段）。
          # **不要**再回落到「去掉通道后缀的基版本」：`## 7.2` 现在是冻结的历史段
          # （431 行），推 v7.2-release12 这种旧式 tag 会把那一整段当成新版说明发出去。
          FROM="## $RELEASE_VERSION"
          NOTES=$(extract "$RELEASE_VERSION")
          if [ -z "$NOTES" ]; then
            FIRST=$(awk '/^## /{sub(/^## /,""); print; exit}' CHANGELOG.md)
            FROM="## $FIRST（回落）"
            NOTES=$(extract "$FIRST")
          fi
          if [ -z "$NOTES" ]; then
            echo "❌ CHANGELOG.md 里一个 ## 段都取不到，发版说明会是空的——先写 CHANGELOG" >&2
            exit 1
          fi
          echo "发版说明取自 CHANGELOG 的 $FROM"

          # 发版说明最前面固定顶两行警告。这两件事是支持成本最高的来源：
          # 一是把 server 包当客户端下，二是装完没把资源包挪到「已选」最顶部——
          # 后者会让大部分汉化不生效，看上去就像我们没翻。两者都发生在**下载那一刻**，
          # 游戏内提示救不了：服务端包里根本没有 kubejs/client_scripts。
          # 例子里的整合包版本按 versions/ 现取，不写死，出 7.4 时不必记得改这里。
          EX_MC=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1)
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            printf '%s\n' \
              '> ## ⚠️ 下载前先看这两行' \
              '>' \
              '> **① 认文件名：带 `client` 的是玩家装的，带 `server` 的只有开服的人才需要。**' \
              "> 例如 \`atm10-zh_cn-client-${RELEASE_VERSION}-atm${EX_MC}.zip\` 就是客户端的包。" \
              "> 后面的 \`atm${EX_MC}\` 是**整合包版本**，按你自己那个整合包的版本挑。" \
              '>' \
              '> **② 装完进游戏检查：选项 → 资源包，汉化包必须在「已选」那一侧的最顶部**，' \
              '> 否则大部分汉化都不会生效。' \
              ''
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

          # 一次发版挂上全部整合包版本的包：
          #   atm10-zh_cn-{client,server}-<补丁版本>-atm<整合包版本>.zip
          # build_dist.sh 直接产出 ASCII 名（连解压出来的文件夹名也是 ASCII）——
          # 中文文件夹名在 Windows 各解压软件下编码不一致，用户拿到手就是乱码。
          # 每个声明过的整合包版本都必须有客户端 + 服务端两个包，缺一个就别发。
          # 按清单逐个点名，不是 `ls` 出多少算多少——少打了一个版本必须当场发现。
          # （不用 mapfile：那是 bash 4+ 的内建，本机 bash 3.2 跑不了，
          #   本地就验不了这段门控。）
          ZIPS=()
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            for side in client server; do
              f="dist/atm10-zh_cn-${side}-${RELEASE_VERSION}-atm${v}.zip"
              [ -f "$f" ] || { echo "❌ 缺少 $f"; exit 1; }
              ZIPS+=("$f")
            done
          done
          [ "${#ZIPS[@]}" -ge 2 ] || { echo "❌ versions/ 下一个版本都没有"; exit 1; }
          printf '  挂载: %s\n' "${ZIPS[@]}"

          {
            echo 'files<<RELEASE_FILES_EOF'
            printf '%s\n' "${ZIPS[@]}"
            echo 'RELEASE_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        # 钉完整 commit SHA：这一步握着 contents:write，用可移动的 @v3 意味着
        # 标签被挪动或上游被入侵时，写权限直接易主。（issue #9 P1-6）
        # 对应 softprops/action-gh-release 的 v3.0.2（2026-08-06 解析）。
        # 从 v2.6.2 换上来只为跟上 node24——两版 action.yml 逐行 diff **只差
        # `using: node20` → `node24` 这一行**，输入项一字未改，是纯换运行时。
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: 绿油油版汉化 v${{ steps.release.outputs.version }}
          body: ${{ steps.publish.outputs.notes }}
          prerelease: ${{ steps.release.outputs.beta }}
          files: ${{ steps.publish.outputs.files }}
          fail_on_unmatched_files: true

      # 发版这一步的可核对数字摊在 run 摘要页上：挂了哪几个包、多大、sha256，
      # 以及发版说明取自 CHANGELOG 的哪一段。
      #
      # 这里比 build.yml 那份更要紧：发版是**不可回退**的动作，tag 一推、包一挂，
      # 就已经在别人的下载列表里了。「说明取自哪一段」尤其要能一眼看到——
      # 历史上出过拿旧段落当新版说明发出去（`## 7.*` 当正则匹配上 `## 7.2`）。
      #
      # 整块兜底：算不出数只是没得看，绝不能把已经发出去的版本判红。
      - name: 作业摘要
        if: always()
        # **一律走 env，不把 ${{ }} 内联进 run 的脚本体**：发版说明取自 CHANGELOG，
        # 那是仓库内容，内联等于把它交给 shell 解析（反引号、$(...) 都会执行）。
        # 走环境变量则永远是数据。同理也就不必用 heredoc——终止符缩进错了不闭合，
        # 而且正文里真出现一行 EOF 标记就会截断。
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          BETA: ${{ steps.release.outputs.beta }}
          NOTES: ${{ steps.publish.outputs.notes }}
        run: |
          {
            printf '## 发版 v%s\n\n' "$VERSION"
            echo '| | |'
            echo '|---|---|'
            if [ "$PUBLISH" = 'true' ]; then
              echo '| 是否真的发布 | 是 |'
            else
              echo '| 是否真的发布 | 否（只构建，没推 release）|'
            fi
            printf '| 预发布 | %s |\n' "$BETA"
            printf '| 整合包版本 | %s |\n' \
              "$(ls -d versions/[0-9]* 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
            printf '\n### 挂载的包\n\n| 文件 | 大小 | sha256 |\n|---|--:|---|\n'
            for f in dist/*.zip; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s | `%s…` |\n' "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -c1-16)"
            done
            printf '\n### 发版说明（就是挂上去的那份）\n\n'
            echo '<details><summary>展开</summary>'
            echo
            printf '%s\n' "$NOTES"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY" || true
