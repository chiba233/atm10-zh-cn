name: Installer test

# 安装器改动后，在 macOS / Windows / Linux 三个 runner 上运行端到端测试（造假实例，应用汉化，
# 断言，恢复备份，断言，含可选拼音 mods）。测试驱动是 scripts/test_installer.py：
# Unix 走 install.sh，Windows 走 powershell 5.1 + install.ps1（与双击 .bat 一致）。
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/test_installer.py'
      - 'scripts/build_dist.sh'
      - 'scripts/assemble.py'
      - 'scripts/paths.py'
      - '.github/workflows/installer-test.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/test_installer.py'
      - 'scripts/build_dist.sh'
      - 'scripts/assemble.py'
      - 'scripts/paths.py'
      - '.github/workflows/installer-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 安装器会查询 GitHub API 的最新版。端到端测试不依赖外网，未认证的 API 每小时只有 60 次。
    env:
      ATM_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # 先从 src/ 组装出货树。安装器测试不涉及图片与 lang 生成物，不用下载整合包。
      - name: 从 src/ 组装出货树
        run: python scripts/assemble.py

      # 依次测试应用汉化、恢复原状、安装可选模组。
      - name: 安装器端到端测试
        run: python scripts/test_installer.py
