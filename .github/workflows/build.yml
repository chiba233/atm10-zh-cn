name: Build

# 一次构建产出 versions/ 下声明过的全部整合包版本的包。
#
# kubejs/ config/ resourcepacks/ mods/ 都是产物：CI 每次重新下载整合包和字体，从 src/ 组装
# 出货树，运行生成器，对各版本官方文件打补丁。
#
# 字体都是 OFL（缝合像素字体、思源黑体、思源宋体）。CI 与 macOS 的产物逐张比对，200 张横幅里
# 197 张像素相同，3 张（ATM / ATM之星 / ATM之星自动化）因 freetype 版本不同有细微差别，目视等价。
# PNG 字节因 zlib 版本不同普遍不一样，回归比对要比像素，不比 sha1。

on:
  workflow_dispatch:
    inputs:
      patch_version:
        description: '补丁版本号（如 r12），与整合包版本无关'
        required: true
        default: 'dev'
      targets:
        description: '目标整合包版本，7.* = versions/ 下全部；也可写 7.2 或 "7.1 7.2"'
        required: false
        default: '7.*'
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # PR 也跑完整构建：ci.yml 用 --no-jars，查不到组装、生成器和对官方文件打补丁这一段。
  # 本工作流不引用 secrets，只上传 artifact，fork 提的 PR 也能跑完。
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

jobs:
  build:
    runs-on: ubuntu-latest
    # 产物 PNG 的字节由 Pillow 自带的 freetype / zlib 决定，所以镜像按 digest 固定，Pillow 按
    # requirements.lock 的哈希安装，产物的 sha256 才能比对。版本记在 src/toolchain.lock.json。
    container:
      image: python@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    # 容器里 GitHub Actions 默认用 sh，而脚本里到处是 set -o pipefail（bash 才有）
    defaults:
      run:
        shell: bash
    env:
      ATM_TOOLCHAIN_DIGEST: sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
      # 这条流水线带 jar 完整生成，check.py / check_gui_maps.py 里以生成物为前提的检查必须有前提，
      # 缺了就失败。ci.yml 用 --no-jars，不设这个变量。
      GATE_STRICT: '1'
    steps:
      # git 必须在 checkout 之前装好：镜像里没有 git 时，actions/checkout 会用 REST API 下载
      # tarball，不建 .git，fetch-depth 也被忽略，protect.py 的「新增必须登记」和「清单不许变短」
      # 都不会运行。日志里会出现：
      #   The repository will be downloaded using the GitHub REST API
      - name: 安装 git
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            git ca-certificates >/dev/null
          git --version

      # 要完整历史：保护清单检查要和 HEAD~1 比较，checkout 默认 depth 是 1。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          python -m pip install --quiet --require-hashes -r requirements.lock
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            curl unzip zip ca-certificates default-jdk-headless >/dev/null
          # javac 供 scripts/patch_vaultpatcher.py 使用：随包分发的 VaultPatcher 要打两处性能补丁
          # 再编译（见该脚本 docstring）。缺 javac 时那一步失败，不会跳过。

      - name: 核对工具链
        run: python3 scripts/toolchain.py --strict

      # 出货前再检查一遍保护清单（ci.yml 已经检查过）。
      - name: 检查保护清单
        env:
          # 与 ci.yml 用同一个基准。PR 上 checkout 拿到的是 refs/pull/N/merge，HEAD~1 恰好等于
          # base 只是巧合，所以显式给出 base.sha。取不到时 protect.py 会失败。
          PROTECT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # 流水线里 git 不可用必须失败，见 protect.py 里 PROTECT_REQUIRE_GIT 的注释。
          PROTECT_REQUIRE_GIT: '1'
        run: python3 scripts/compliance/protect.py --check

      - name: 下载字体
        run: ./scripts/fetch_fonts.sh

      - name: 解析要构建哪些整合包版本
        id: t
        run: |
          IN='${{ github.event.inputs.targets }}'
          # 通配符只展开仓库里声明过的版本，不查 CurseForge：否则 ATM 一发新版，
          # CI 就会构建一个没验证过的包。
          if [ -z "$IN" ] || [ "$IN" = "7.*" ]; then
            IN=$(ls -d versions/[0-9]* | xargs -n1 basename | tr '\n' ' ')
          fi
          echo "list=$IN" >> "$GITHUB_OUTPUT"
          echo "将构建: $IN"


      # 已发布版本的 overrides 不会变，缓存键用仓库里记录的指纹，只有改了目标版本才失效。
      # 命中缓存就不访问 CurseForge。未命中才下载，下载后必须与 versions/<版本>/overrides.sha256
      # 一致，否则构建失败。
      - uses: actions/cache@v6
        with:
          path: build/packsrc
          key: packsrc-${{ hashFiles('versions/*/overrides.sha256') }}

      - name: 下载整合包与全部模组 jar
        run: |
          set -euo pipefail
          # 生成器要读 mod jar 里的 en_us 与注册表，取最新版即可（资源包 lang 各版本通用）。
          NEWEST=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1)
          echo "以 ATM10 $NEWEST 为生成基准"
          echo "NEWEST=$NEWEST" >> "$GITHUB_ENV"
          # 新版本首次入库时，指纹由 CI 计算，不用开发机下载的文件（可能限速、中断、少几个 jar）。
          RECORD=''
          [ -f "versions/$NEWEST/overrides.sha256" ] || RECORD='--record'
          # 这个标志要在生成基线之前确定：生成后文件已存在，再用 hashFiles 判断会跳过后面的步骤。
          if [ -f "versions/db/$NEWEST/jars.json" ]; then
            echo "NEW_VERSION=0" >> "$GITHUB_ENV"
          else
            echo "NEW_VERSION=1" >> "$GITHUB_ENV"
          fi
          python3 scripts/fetch_pack.py "$NEWEST" pack $RECORD
          echo "ATM_PACK_ROOT=$PWD/pack" >> "$GITHUB_ENV"
          # 每个目标版本再下载一份 overrides（不下 jar）：上游补丁必须对着该版的官方文件打。
          for v in ${{ steps.t.outputs.list }}; do
            [ -d "build/packsrc/$v/kubejs" ] || python3 scripts/fetch_pack.py "$v" "build/packsrc/$v" --no-jars
          done
          # 下载的 jar 必须与 versions/db/<版本>/jars.json 逐字节一致，否则限速、404、下错文件
          # 只会让生成器少产内容而不报错（issue #9 P1-5）。
          if [ -f "versions/db/$NEWEST/jars.json" ]; then
            python3 scripts/build_version_db.py --verify "$NEWEST" pack/mods
          else
            echo "versions/db/$NEWEST/jars.json 不存在：新版本首次入库，基线生成之后再核对"
          fi

      # 整合包发新版时，基线由 CI 生成，由人核对后提交。基线没入库时不继续构建：
      # 没有基线，就无法证明产出的包对应的是干净的官方文件。
      - name: 生成新版本的基线
        if: env.NEW_VERSION == '1'
        run: |
          set -euo pipefail
          echo "versions/db/$NEWEST/ 还不存在，ATM10 $NEWEST 是第一次入库。"
          python3 scripts/build_version_db.py "$NEWEST" pack/mods
          python3 scripts/build_en_baseline.py "$NEWEST" pack/mods pack
          # 按键注册名也是入库数据，check.py 的按键检查依赖它。基线提交后 NEW_VERSION 变成 0，
          # 本步骤不再运行，所以只能在这里生成。
          python3 scripts/scan_keybinds.py pack/mods "versions/db/$NEWEST/keybinds.json"
          PREV=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -2 | head -1)
          echo "───── 与上一版 $PREV 的英文底本漂移 ─────"
          # 不加 || true：这个脚本总是返回 0，报错说明脚本本身坏了，要失败。
          python3 scripts/check_en_drift.py "$PREV" "$NEWEST"

      - uses: actions/upload-artifact@v7
        if: env.NEW_VERSION == '1'
        with:
          name: new-version-baseline-${{ env.NEWEST }}
          path: |
            versions/${{ env.NEWEST }}/
            versions/db/${{ env.NEWEST }}/
          retention-days: 30

      - name: 基线未入库时停止构建
        if: env.NEW_VERSION == '1'
        run: |
          echo "❌ ATM10 $NEWEST 的基线刚由本次 CI 生成，尚未提交进仓库。"
          echo "   下载 artifact「new-version-baseline-$NEWEST」，人工核对后提交："
          echo "     versions/$NEWEST/overrides.sha256   （官方 overrides 的内容指纹）"
          echo "     versions/db/$NEWEST/                （jar 字节基线 / 英文底本）"
          echo "   提交后重跑本流水线，才会真正出包。"
          exit 1

      # 资源树育种结构（哪个任务对应哪棵树、父本是谁）是该版基线，版本入库时扫描一次，
      # 核对后提交。任务书基线必须与「用当前的取值器，对着该版官方文件」算出的结果一致：
      # 取值器读不了多行数组时，八千多个键里七百多个被丢掉，check_en_drift.py 不会报错，
      # ATM 把「12 个耀光下界书架」改成 13 个就这样漏了一版。基线本身错了，只能重算才发现。
      #
      # 只需要 overrides（上面每个版本都下载过），不用 jar。与其余基线一样：重算、上传
      # artifact、失败，等人提交。
      - name: 检查任务书基线
        id: qbase
        env:
          BASELINE_WRITE: '1'
        run: |
          set -euo pipefail
          stale=''
          for v in ${{ steps.t.outputs.list }}; do
            python3 scripts/build_en_baseline.py --check-quest "$v" "build/packsrc/$v" || stale="$stale $v"
          done
          if [ -n "$stale" ]; then
            echo "QBASE_STALE=1" >> "$GITHUB_ENV"
            echo "STALE_VERS=$stale" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        if: env.QBASE_STALE == '1'
        with:
          name: quest-baseline
          path: versions/db/*/quest_baseline.json
          retention-days: 30

      - name: 任务书基线未入库时停止构建
        if: env.QBASE_STALE == '1'
        run: |
          echo "❌ 这几版的任务书基线与重算结果不一致：$STALE_VERS"
          echo "   下载 artifact「quest-baseline」，人工核对后提交 versions/db/*/quest_baseline.json。"
          exit 1

      # 已发布版本的章节与配方不会再变，之后的构建只读基线。只在缺基线时扫描，也只为缺的
      # 版本下载 jar（按画像单取一个，核对 sha256）。扫描后上传 artifact 并失败，等人提交。
      - name: 补扫缺失的育种结构基线
        id: trees
        run: |
          set -euo pipefail
          missing=''
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            [ -f "versions/db/$v/productive_trees.json" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "全部在册版本都已有育种结构基线"; exit 0
          fi
          for v in $missing; do
            echo "───── ATM10 $v 缺基线，现扫 ─────"
            python3 scripts/fetch_one_jar.py "$v" productivetrees "build/packsrc/$v/mods"
            python3 scripts/scan_productive_trees.py "$v" "build/packsrc/$v"
          done
          echo "TREES_MISSING=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: env.TREES_MISSING == '1'
        with:
          name: productive-trees-baseline
          path: versions/db/*/productive_trees.json
          retention-days: 30

      - name: 育种结构基线未入库时停止构建
        if: env.TREES_MISSING == '1'
        run: |
          echo "❌ 有整合包版本还没有育种结构基线，已由本次 CI 扫出但尚未提交。"
          echo "   下载 artifact「productive-trees-baseline」，核对后提交"
          echo "   versions/db/<版本>/productive_trees.json，再重跑本流水线。"
          exit 1

      # VaultPatcher 模块要逐版核对：target_class 在这一版的哪个 jar、每条 key 在不在常量池里。
      # 加一个带 target_class 的模块，五个版本的库同时过期，而 gen_vaultpatcher 一次只报一版。
      #
      # 这里一次补齐：只在缺的时候运行，只为缺的版本下载 jar，补完上传 artifact 并失败，等人提交。
      # 用 --only-missing：老版本的 jars.json 是固定的字节基线，不重写，而是用它核对这次
      # 下载的 jar（少下、下坏、下错版本都会失败）。
      - name: 补全 VaultPatcher 库缺失的模块记录
        run: |
          set -euo pipefail
          stale=$(python3 scripts/stale_version_dbs.py)
          if [ -z "$stale" ]; then
            echo "全部在册版本的 VaultPatcher 库都已收录现有模块"; exit 0
          fi
          python3 scripts/stale_version_dbs.py --why
          for v in $stale; do
            echo "───── ATM10 $v 补库 ─────"
            if [ "$v" = "$NEWEST" ]; then
              # 最新版的整包上面已下载并逐字节核对过，直接用
              python3 scripts/build_version_db.py "$v" pack/mods --only-missing
            else
              # 不下载到 build/packsrc/：那个目录进 actions/cache，
              # 四个版本的 jar 共 2.8 GiB，会占满缓存额度。
              python3 scripts/fetch_pack.py "$v" "build/dbfix/$v"
              python3 scripts/build_version_db.py "$v" "build/dbfix/$v/mods" --only-missing
            fi
          done
          echo "VPDB_STALE=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: env.VPDB_STALE == '1'
        with:
          name: vaultpatcher-db
          path: versions/db/*/vaultpatcher.json
          retention-days: 30

      - name: VaultPatcher 库未入库时停止构建
        if: env.VPDB_STALE == '1'
        run: |
          echo "❌ 有整合包版本的 VaultPatcher 库缺模块记录，本次 CI 已按该版的 jar 补出，尚未提交。"
          echo "   下载 artifact「vaultpatcher-db」，核对后提交"
          echo "   versions/db/<版本>/vaultpatcher.json，再重跑本流水线。"
          echo "   核对新模块的 target_class 记成 declared 还是 not_found。"
          echo "   not_found 表示这一版没有这个 mod，打包时该模块的 mods 字段留空。"
          exit 1

      - name: 生成全部汉化产物
        run: ./scripts/generate_all.sh

      # check_gui_maps.py 检查重复映射、重复属性、套用后的非法 XML。它要读 mod jar，所以放在
      # 生成之后。$ATM_PACK_ROOT 是最新版的完整包。不能退回 build/packsrc/<版本>/mods：那里只有
      # 单个 jar，没有界面 XML，脚本会直接通过。
      - name: 检查界面 XML 映射
        run: python3 scripts/compliance/check_gui_maps.py "$ATM_PACK_ROOT/mods"

      # issue #3：建筑棒的类别路径同时用作面包屑和 Map 键，译了会 NPE 闪退。规则
      # vp-no-path-prefix-keys 拦「以 / 开头的键」，这一步用真 jar 里的全部蓝图路径回放替换表，
      # 改动一个字符就失败。要读 jar，所以放在这里。
      - name: 检查蓝图类别路径
        run: python3 scripts/compliance/check_minecolonies_paths.py "$ATM_PACK_ROOT/mods"

      - name: 打包全部版本
        run: ./scripts/build_dist.sh "${{ github.event.inputs.patch_version || 'dev' }}" "${{ steps.t.outputs.list }}"

      - uses: actions/upload-artifact@v7
        with:
          name: atm10-zh_cn-${{ github.event.inputs.patch_version || 'dev' }}
          path: dist/*.zip
          retention-days: 30

      # 在 run 摘要页列出产物的文件、大小、sha256 与键数，两次 run 并排看就能发现某版少了键。
      # 整块容错：算不出数不影响已经打好的包。
      - name: 作业摘要
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import zipfile, hashlib, io, json, re, glob, os
          KEY = re.compile(r'^\t*([A-Za-z0-9_.]+):\s', re.M)
          print('## 产物\n')
          print('| 包 | 大小 | sha256 | 任务书键 | 资源包命名空间 | 资源包键 |')
          print('|---|---:|---|---:|---:|---:|')
          for f in sorted(glob.glob('dist/*.zip')):
              b = open(f, 'rb').read()
              z = zipfile.ZipFile(io.BytesIO(b))
              q = ns = pk = 0
              for n in z.namelist():
                  if '/quests/lang/zh_cn/' in n and n.endswith('.snbt'):
                      q += len(KEY.findall(z.read(n).decode('utf-8', 'ignore')))
              inner = [n for n in z.namelist() if n.endswith('.zip') and 'resourcepacks' in n]
              if inner:
                  p = zipfile.ZipFile(io.BytesIO(z.read(inner[0])))
                  ns = len({n.split('/')[1] for n in p.namelist()
                            if n.startswith('assets/') and n.count('/') > 1})
                  for n in p.namelist():
                      if n.endswith('lang/zh_cn.json'):
                          try: pk += len(json.loads(p.read(n).decode('utf-8')))
                          except Exception: pass
              print('| `%s` | %.1f MB | `%s` | %s | %s | %s |' % (
                    os.path.basename(f), len(b) / 1048576,
                    hashlib.sha256(b).hexdigest()[:16], q or '—', ns or '—', pk or '—'))
          PY
