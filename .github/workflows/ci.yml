name: CI

# 每个 PR 与 main push 都运行的快速检查，不下载 mod jar（那在 build.yml，一次十几分钟）。
#
# 先用 assemble.py 从 src/ 组装出货树，然后：
#   1. 上游漂移：用每个声明过的整合包版本的官方文件套一遍改动映射，ATM 改了哪一行就失败。
#   2. 汉化文件检查（JSON、枚举协议值、占位符、任务书 delta 等）。
# 安装器的三系统测试在 installer-test.yml，完整打包在 build.yml。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 上游漂移 + 汉化校验
    runs-on: ubuntu-latest
    steps:
      # 保护清单要和上一版比较，需要完整历史。fetch-depth: 2 只够一次 push 一笔，
      # 一次推多笔时 github.event.before 不在克隆里，PR 的 base.sha 也可能在几十笔之前，
      # 取不到 base 时 protect.py 会失败。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 放在最前面：src/ 少一个文件就立刻失败，不用等完整构建。
      # 先运行反例测试，确认保护清单检查本身会失败。
      - name: 保护清单检查的反例测试
        id: g_protect_self
        run: python3 scripts/compliance/test_protect.py

      - name: 检查保护清单
        id: g_protect
        env:
          PROTECT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # 流水线里 git 不可用必须失败。
          PROTECT_REQUIRE_GIT: '1'
        run: python3 scripts/compliance/protect.py --check

      # 不需要 mod jar，PR 阶段就能运行。dynamic 模块里两条 @ 子串键互为子串时，
      # String.replace 的遍历顺序不确定，长的那条会被部分替换，结果半中半英。
      - name: 检查 VaultPatcher dynamic 模块的子串键
        id: g_dynsub
        run: python3 scripts/compliance/check_dynamic_substrings.py

      # 保护清单检查文件在不在，这一步检查 VaultPatcher 模块内容有没有被改动。
      - name: 模块内容哈希
        id: g_modhash
        run: python3 scripts/compliance/check_module_hashes.py

      # 每条反例复现一次真实事故，验证检查确实会失败。
      - name: 检查脚本的反例测试
        id: g_gates
        run: python3 scripts/compliance/test_gates.py

      # 打包白名单决定发版包含哪些包：先验证取不到时会失败，再检查仓库里的白名单。
      - name: 打包白名单
        id: g_whitelist
        run: |
          python3 scripts/compliance/test_release_versions.py
          echo "打包、发布的版本：$(python3 scripts/release_versions.py)"

      # 资源树育种公式：反例测试全是合成数据，不读整合包也不联网。「各版本一致」只读
      # versions/db/<版本>/productive_trees.json。扫描基线要用 jar，在 build.yml。
      - name: 育种公式生成器的反例测试
        id: g_trees
        run: python3 scripts/compliance/test_productive_trees_quest_lang.py

      - name: 比对各版本的育种公式
        id: g_trees_ver
        run: python3 scripts/gen_productive_trees_quest_lang.py --verify-versions

      - name: 从 src/ 组装出货树
        id: g_assemble
        run: python3 scripts/assemble.py

      # 用每个版本自己的官方文件套映射，找不到原文就退出：否则发出去的是「旧上游 + 本包改动」，
      # 上游的修复会被覆盖。

      # 已发布版本的 overrides 不会变，缓存键用仓库里记录的指纹，只有改了目标版本才失效。
      # 命中缓存就不访问 CurseForge。未命中才下载，下载后必须与 versions/<版本>/overrides.sha256
      # 一致，否则失败。
      - uses: actions/cache@v6
        with:
          path: build/packsrc
          key: packsrc-${{ hashFiles('versions/*/overrides.sha256') }}

      - name: 上游文件漂移检测（各版本）
        id: g_drift
        run: |
          set -euo pipefail
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            echo "───── ATM10 $v ─────"
            if [ ! -d "build/packsrc/$v/kubejs" ]; then
              python3 scripts/fetch_pack.py "$v" "build/packsrc/$v" --no-jars
            else
              echo "  命中缓存，核对指纹"
              python3 scripts/fetch_pack.py --verify "$v" "build/packsrc/$v"
            fi
            rm -rf "build/v/$v"; mkdir -p build/v; cp -R build/common "build/v/$v"
            python3 scripts/gen_upstream_patches.py "build/packsrc/$v" "build/v/$v" "$v"
            python3 scripts/gen_vaultpatcher.py "$v" "build/v/$v"
          done

      # 逐版本检查：JSON 合法、枚举协议值不译、VaultPatcher 主配置、.gui choice 保持英文、
      # 占位符与颜色码、任务书 delta 无重复键。
      # 不设 GATE_STRICT：这里用 --no-jars，界面 XML、蜂名脚本、上游格式串快照这些要读 jar 的
      # 生成物不存在。完整生成与 GATE_STRICT=1 在 build.yml。
      - name: 汉化文件校验（各版本）
        id: g_check
        run: |
          set -euo pipefail
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            echo "───── ATM10 $v ─────"
            python3 scripts/check.py "build/v/$v"
          done

      # 任务书的 & 颜色码写错，游戏里整段描述会被红字报错替代。要查整合包自带中文与本包覆盖
      # 合并后的结果，错误可能在整合包的文件里，只查出货树看不到。
      - name: 检查任务书的 & 颜色码（各版本）
        id: g_quest
        run: |
          set -euo pipefail
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            echo "───── ATM10 $v ─────"
            python3 scripts/compliance/check_quest_formatting.py "build/packsrc/$v"
          done

      - name: 安装脚本语法检查
        id: g_installer
        run: bash -n installer/install.sh

      # 在 run 摘要页列出各项检查的结果。某项失败后，后面的步骤不运行，outcome 为空，
      # 摘要里显示「未运行」，与「通过」区分开。
      #
      # 摘要放在最后，带 if: always() 和 `|| true`，生成摘要出错不影响检查结果。
      - name: 作业摘要
        if: always()
        run: |
          emit() {
            case "$2" in
              success) m='通过' ;;
              failure) m='失败' ;;
              *)       m='未运行' ;;
            esac
            printf '| %s | %s |\n' "$1" "$m"
          }
          {
            echo '## 上游漂移 + 汉化校验'
            echo
            echo '| 检查 | 结果 |'
            echo '|---|---|'
            emit '保护清单检查的反例测试'                 '${{ steps.g_protect_self.outcome }}'
            emit '检查保护清单'                           '${{ steps.g_protect.outcome }}'
            emit '检查 VaultPatcher dynamic 模块的子串键' '${{ steps.g_dynsub.outcome }}'
            emit '模块内容哈希'                           '${{ steps.g_modhash.outcome }}'
            emit '检查脚本的反例测试'                     '${{ steps.g_gates.outcome }}'
            emit '打包白名单'                             '${{ steps.g_whitelist.outcome }}'
            emit '育种公式生成器的反例测试'               '${{ steps.g_trees.outcome }}'
            emit '比对各版本的育种公式'                   '${{ steps.g_trees_ver.outcome }}'
            emit '从 src/ 组装出货树'                     '${{ steps.g_assemble.outcome }}'
            emit '上游文件漂移检测'                       '${{ steps.g_drift.outcome }}'
            emit '汉化文件校验'                           '${{ steps.g_check.outcome }}'
            emit '检查任务书的 & 颜色码'                  '${{ steps.g_quest.outcome }}'
            emit '安装脚本语法检查'                       '${{ steps.g_installer.outcome }}'
            echo
            echo "覆盖的整合包版本：$(ls -d versions/[0-9]* 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY" || true
